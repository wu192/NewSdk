name: Recover Utility DLL
on:
  push:
    branches: [recovery/utility-source]
    paths:
      - '.github/workflows/recover-utility.yml'
      - 'recovery/scripts/RecoverUtility.ps1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: utility-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recover:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Recover complete C# projects using pinned ILSpy
        shell: pwsh
        run: ./recovery/scripts/RecoverUtility.ps1
      - name: Summarize CI evidence
        if: always()
        env:
          ARTIFACT_PATHS: |
            recovery/evidence/utility/${{ github.run_id }}-${{ github.run_attempt }}/*.json
            recovery/evidence/utility/${{ github.run_id }}-${{ github.run_attempt }}/*.log
            recovery/evidence/utility/${{ github.run_id }}-${{ github.run_attempt }}/*difference*.txt
        run: python recovery/scripts/WriteCiSummary.py --title "CI evidence"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: 'utility-${{ github.run_id }}-${{ github.run_attempt }}'
          path: |
            recovery/evidence/utility/${{ github.run_id }}-${{ github.run_attempt }}/*.json
            recovery/evidence/utility/${{ github.run_id }}-${{ github.run_attempt }}/*.log
            recovery/evidence/utility/${{ github.run_id }}-${{ github.run_attempt }}/*difference*.txt
          retention-days: 1
          if-no-files-found: warn
      - name: Commit complete recovered source
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- recovery/src/Managed/Utility recovery/evidence/utility
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Recover Utility C# source using ILSpy"
          if ($LASTEXITCODE -ne 0) { throw 'Source commit failed' }
          git pull --rebase origin $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Concurrent update needs resolution; artifact retained' }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Source push failed; artifact retained' }
