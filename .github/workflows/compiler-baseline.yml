name: Original compiler basic-data baseline
on:
  push:
    branches: [recovery/compiler-source]
    paths:
      - '.github/workflows/compiler-baseline.yml'
      - 'recovery/scripts/Baseline.ps1'
permissions:
  contents: write
jobs:
  baseline:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run the GUI's basic-data compiler command
        shell: pwsh
        run: ./recovery/scripts/Baseline.ps1
      - name: Summarize CI evidence
        if: always()
        env:
          ARTIFACT_PATHS: |
            recovery/evidence/baseline/**/*.json
            recovery/evidence/baseline/**/*.log
            recovery/evidence/baseline/**/*.md
            recovery/evidence/baseline/**/*.csv
            recovery/evidence/baseline/**/*.tsv
            !**/bin/**
            !**/test-work/**
            !**/baseline-streams/**
        run: python recovery/scripts/WriteCiSummary.py --title "CI evidence"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: 'original-basic-data-baseline'
          path: |
            recovery/evidence/baseline/**/*.json
            recovery/evidence/baseline/**/*.log
            recovery/evidence/baseline/**/*.md
            recovery/evidence/baseline/**/*.csv
            recovery/evidence/baseline/**/*.tsv
            !**/bin/**
            !**/test-work/**
            !**/baseline-streams/**
          retention-days: 1
          if-no-files-found: warn
      - name: Commit baseline report
        if: success()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovery/evidence/baseline
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'recovery: record original example-mod basic-data baseline'
          git pull --rebase origin recovery/compiler-source
          git push origin HEAD:recovery/compiler-source
