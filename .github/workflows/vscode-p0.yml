name: NewSdk VS Code and FX

on:
  push:
    branches: [feat/vscode-p0]
    paths: ['vscode-extension/**', '.github/workflows/vscode-p0.yml']
  pull_request:
    paths: ['vscode-extension/**', '.github/workflows/vscode-p0.yml']
  workflow_dispatch:
    inputs:
      full_acceptance:
        description: '运行真实编译器的完整 P0 验收组合'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vscode-p0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-extension:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: vscode-extension
        shell: pwsh
    env:
      NEWSDK_COMPILER_URL: ${{ secrets.NEWSDK_COMPILER_URL }}
      NEWSDK_COMPILER_SHA256: ${{ secrets.NEWSDK_COMPILER_SHA256 }}
      NEWSDK_COMPILER_AUTHORIZATION: ${{ secrets.NEWSDK_COMPILER_AUTHORIZATION }}
      NEWSDK_ACCEPTANCE: ${{ inputs.full_acceptance && 'full' || 'smoke' }}
      NEWSDK_TEST_EVIDENCE: ${{ github.workspace }}/vscode-extension/test-results
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Install extension dependencies
        run: npm ci
      - name: Resolve provided compiler release
        run: |
          $release = Get-Content compiler-release.json -Raw | ConvertFrom-Json
          if ($env:NEWSDK_COMPILER_URL -eq $release.url -and -not $env:NEWSDK_COMPILER_SHA256) {
            "NEWSDK_COMPILER_SHA256=$($release.sha256)" >> $env:GITHUB_ENV
          }
      - name: Compile and run protocol, configuration and ZIP boundary tests
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          npm test 2>&1 | Tee-Object test-results/unit-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Extension unit tests failed' }
      - name: Install fixed browser for FX regression
        run: npx playwright install chromium
      - name: Fixed-frame WebGL2, editor gestures and lifecycle regression
        run: npm run test:render
      - name: Package installable VSIX without bundling compiler
        run: |
          npm run package 2>&1 | Tee-Object test-results/package.log
          if ($LASTEXITCODE -ne 0) { throw 'VSIX packaging failed' }
      - name: Checkout fixed compiler source from this public repository
        if: env.NEWSDK_COMPILER_URL == ''
        uses: actions/checkout@v4
        with:
          ref: a75840ef7d0351cedc11c91b1b4510d295b911a7
          path: .compiler-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /recovery/src/
            /recovery/build/
            /recovery/scripts/BuildCompiler.ps1
            /recovery/scripts/BuildManagedFoundation.ps1
            /recovery/scripts/BuildCompilerNative.ps1
            /recovery/scripts/RestoreUiDependencies.ps1
            /ui/
            /SDK/tools/antlr.runtime.dll
            /SDK/tools/BinaryAssetBuilder.Utility.dll
            /SDK/tools/BinaryAssetBuilder.Core.dll
      - name: Setup compiler build SDK
        if: env.NEWSDK_COMPILER_URL == ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Setup compiler native x86 toolchain
        if: env.NEWSDK_COMPILER_URL == ''
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build actual compiler from fixed source
        if: env.NEWSDK_COMPILER_URL == ''
        working-directory: .compiler-source
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'newsdk-actual-compiler'
          ./recovery/scripts/BuildCompiler.ps1 -Configuration Release -OutputDirectory $destination 2>&1 | Tee-Object ../vscode-extension/test-results/compiler-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Compiler source build failed' }
          $executable = Join-Path $destination 'bin/NewModCompiler.exe'
          if (-not (Test-Path $executable)) { throw 'Compiler source build did not produce NewModCompiler.exe' }
          "NEWSDK_COMPILER_PATH=$executable" >> $env:GITHUB_ENV
          'NEWSDK_COMPILER_SOURCE_REF=a75840ef7d0351cedc11c91b1b4510d295b911a7' >> $env:GITHUB_ENV
      - name: Real Windows VS Code host, task lifecycle and actual compiler
        env:
          NEWSDK_TEST_ROOT: ${{ runner.temp }}/newsdk-p0-host
        run: |
          npm run test:host 2>&1 | Tee-Object test-results/extension-host.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows extension-host tests failed' }
      - name: Record compiler availability and acceptance scope
        if: always()
        run: |
          if ($env:NEWSDK_COMPILER_PATH) {
            "Actual compiler built from fixed public source $env:NEWSDK_COMPILER_SOURCE_REF. See compiler-source.json and real-compiler.json." >> $env:GITHUB_STEP_SUMMARY
          } elseif ($env:NEWSDK_COMPILER_URL) {
            'Packaged compiler URL supplied. See real-compiler.json for the actual executed cases.' >> $env:GITHUB_STEP_SUMMARY
          } else {
            'Real compiler tests SKIPPED: NEWSDK_COMPILER_URL is not configured. Protocol and extension-host checks do not establish P0 completion.' >> $env:GITHUB_STEP_SUMMARY
          }
          'See real-compiler.json and cancellation evidence for the actual executed scope. Smoke success alone does not establish complete P0 acceptance.' >> $env:GITHUB_STEP_SUMMARY
      - name: Save installable VSIX
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          retention-days: 1
          name: NewSdk-Mod-Tools-FX-Round1-VSIX-${{ github.run_id }}-${{ github.run_attempt }}
          path: vscode-extension/NewSdk-Mod-Tools-FX-Round1.vsix
          if-no-files-found: warn
      - name: Save protocol evidence and failure logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 3
          name: NewSdk-Mod-Tools-FX-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            vscode-extension/test-results/
            ${{ runner.temp }}/newsdk-p0-host/user-data/logs/
          if-no-files-found: warn
