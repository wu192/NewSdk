name: Compiler BIG over 2 GiB release
permissions:
  contents: write
concurrency:
  group: compiler-big-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /*
          !/recovery/evidence/
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86
    - name: Preflight official reference bundle and small MOD schema
      shell: pwsh
      run: |
        python -m pip install lxml==6.0.2
        if($LASTEXITCODE -ne 0){throw 'Schema dependency installation failed'}
        python recovery/scripts/TestNeutralWorldbuilder.py --preflight
        if($LASTEXITCODE -ne 0){throw 'Official reference/small MOD preflight failed'}
    - name: Managed App contracts including global and project option precedence
      shell: pwsh
      run: |
        foreach($mode in @('Debug','Release')) {
          $out="recovery/artifacts/neutral-app/$mode"
          ./recovery/scripts/BuildApp.ps1 -Tests -Configuration $mode -OutputDirectory $out
          & "$out/NewModCompiler.AppTests.exe" "C:\neutral-app-$mode" *> "$out/contracts.log"
          if($LASTEXITCODE -ne 0){Get-Content "$out/contracts.log" -Tail 100;throw "$mode App contracts failed"}
          Get-Content "$out/contracts.log" -Tail 12
        }
    - name: Real x86 resolver and BIG above 2 GiB
      shell: pwsh
      run: |
        $vs=& "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.Component.MSBuild -property installationPath
        $csc=Join-Path $vs 'MSBuild/Current/Bin/Roslyn/csc.exe'
        $refs=Join-Path ${env:ProgramFiles(x86)} 'Reference Assemblies/Microsoft/Framework/.NETFramework/v4.8'
        $sources=@(Get-ChildItem recovery/src/App -Recurse -Filter '*.cs' | Sort-Object FullName | ForEach-Object FullName)
        $references=@('mscorlib','System','System.Core','System.Configuration','System.Web.Extensions','System.Xml') | ForEach-Object { '/reference:'+(Join-Path $refs "$_.dll") }
        foreach($mode in @('Debug','Release')) {
          $out="recovery/artifacts/neutral-app/$mode"
          $opt=if($mode -eq 'Release'){'/optimize+'}else{'/debug:full'}
          & $csc /nologo /noconfig /nostdlib+ /target:exe /platform:x86 /langversion:7.3 $opt /main:NewModCompiler.Tests.LargeBigTests "/out:$out/LargeBigTests.exe" @references @sources recovery/tests/large-big/LargeBigTests.cs
          if($LASTEXITCODE -ne 0){throw "$mode large BIG host compilation failed"}
          & "$out/LargeBigTests.exe" "$env:RUNNER_TEMP/large-big-$mode" *> "$out/large-big.log"
          Get-Content "$out/large-big.log"
          if($LASTEXITCODE -ne 0){throw "$mode over-2GiB regression failed"}
        }
    - name: Original HashFix and resolver component differential (LoD canonical is in App)
      shell: pwsh
      run: |
        $vs=& "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.Component.MSBuild -property installationPath
        $csc=Join-Path $vs 'MSBuild/Current/Bin/Roslyn/csc.exe'
        foreach($mode in @('Debug','Release')) {
          $out="recovery/artifacts/neutral-components/$mode";New-Item -ItemType Directory -Force $out|Out-Null
          $opt=if($mode -eq 'Release'){'/optimize+'}else{'/debug:full'}
          & $csc /nologo /target:exe /platform:x86 /langversion:7.3 /r:System.Web.Extensions.dll $opt "/out:$out/BasePostprocessControl.exe" recovery/src/App/Application/HashFix.cs recovery/src/App/Application/ModAssetResolver.cs recovery/src/App/Application/WorldbuilderPayload.cs recovery/src/App/Application/LoDStreamBuilder.cs recovery/preparation/base-postprocess/BasePostprocessControl.cs
          if($LASTEXITCODE -ne 0){throw 'Base postprocess validation host compilation failed'}
          python recovery/preparation/base-postprocess/TestCompilerBasePostprocess.py --tools SDK/tools --candidate "$out/BasePostprocessControl.exe" --output "$out/evidence" --hashfix-resolver-only
          if($LASTEXITCODE -ne 0){throw "$mode original base postprocess differential failed"}
        }
    - name: Build current Debug and Release and production-object validation hosts
      shell: pwsh
      run: |
        foreach($mode in @('Debug','Release')) {
          $out="recovery/artifacts/neutral-product/$mode"
          ./recovery/scripts/BuildCompiler.ps1 -Configuration $mode -OutputDirectory $out
          ./recovery/scripts/BuildCompilerValidationHost.ps1 -ProductBuildDirectory $out -OutputDirectory "$out/validation"
        }
    - name: Existing real Core and application pipeline contracts
      shell: pwsh
      run: |
        ./recovery/scripts/TestCompilerCoreLifecycle.ps1 -CompilerDirectory recovery/artifacts/neutral-product -OutputDirectory recovery/artifacts/neutral-core
    - name: Existing real production CLI success failure cancellation and retry
      shell: pwsh
      run: |
        ./recovery/scripts/TestCompilerCli.ps1 -CompilerDirectory recovery/artifacts/neutral-product -OutputDirectory recovery/artifacts/neutral-cli
    - name: Actual neutral MOD configuration and original tools raw BIG differential
      shell: pwsh
      run: |
        foreach($mode in @('Debug','Release')) {
          python recovery/scripts/TestNeutralWorldbuilder.py --product-build "recovery/artifacts/neutral-product/$mode" --configuration $mode --output "recovery/artifacts/neutral-mod/$mode"
          if($LASTEXITCODE -ne 0){throw "$mode neutral small MOD/original chain failed"}
        }
    - name: Preserve actual Core source diagnostics
      shell: pwsh
      run: |
        foreach($mode in @('Debug','Release')) {
          ./recovery/scripts/TestSourceDiagnostics.ps1 -CompilerPath "recovery/artifacts/neutral-product/$mode/bin/NewModCompiler.exe" -SourceSdkRoot SDK -WorkDirectory "$env:RUNNER_TEMP/newsdk-source-diagnostics-$mode" -SummaryPath "recovery/artifacts/neutral-packaging-diagnostics/$mode.json"
          if($LASTEXITCODE -ne 0){throw "$mode source diagnostics failed"}
        }
    - name: Package exact validated three-file Debug and Release products
      shell: pwsh
      run: |
        python recovery/scripts/PackageNeutralCompiler.py --product-root recovery/artifacts/neutral-product --validation-root recovery/artifacts/neutral-mod --output recovery/artifacts/neutral-packages
        if($LASTEXITCODE -ne 0){throw 'Validated package identity check failed'}
    - name: Publish validated Debug and Release packages
      shell: python {0}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        import hashlib
        import json
        import os
        from pathlib import Path
        import subprocess
        import zipfile

        def need(value, message):
            if not value:
                raise RuntimeError(message)

        def gh(*args):
            return subprocess.check_output(['gh', *map(str, args)], text=True, encoding='utf-8')

        def read(path):
            return json.loads(Path(path).read_text(encoding='utf-8-sig'))

        source = os.environ['GITHUB_SHA']
        repo = os.environ['GITHUB_REPOSITORY']
        run_url = f"https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
        tag = 'compiler-2026.11.06-big-over-2g-' + source[:7]
        out = Path('recovery/artifacts/neutral-packages')
        manifest = read(out / 'manifest.json')
        need(manifest['sourceCommit'] == source, 'Package source differs from this run')
        manifest.update(
            upstreamFixCommit='788566c07449eb0e223ad21e64bc28d15c3d8c56',
            compilerBaseline='d7f788b882cf8d72c4426a3eebe506e3b59903eb',
            largeBigValidation=dict(platform='Windows x86 .NET Framework 4.8',
                payloadBytes=2147487744, configurations=['Debug', 'Release'], runUrl=run_url,
                scope='Actual resolver with/without insertion, BIG inventory/offsets and payload samples crossing 2 GiB; App source identical to product builds'))
        (out / 'manifest.json').write_text(json.dumps(manifest, indent=2)+'\n', encoding='utf-8')
        evidence = {}
        for mode in ('Debug', 'Release'):
            files = {
                'contracts.log': f'neutral-app/{mode}/contracts.log',
                'large-big.log': f'neutral-app/{mode}/large-big.log',
                'product-build.json': f'neutral-product/{mode}/build.json',
                'small-mod.json': f'neutral-mod/{mode}/validation.json',
                'source-diagnostics.json': f'neutral-packaging-diagnostics/{mode}.json',
                'zip-deployment.json': f'neutral-packages/deployment-{mode}/validation.json'}
            log = Path('recovery/artifacts', files['large-big.log']).read_text(encoding='utf-8-sig')
            need('PASS 128 checks; payloadBytes=2147487744' in log, mode+' large BIG checks missing')
            for name, path in files.items():
                evidence[f'{mode}/{name}'] = Path('recovery/artifacts', path)
        for name, path in {'core.json': 'neutral-core/validation.json', 'cli.json': 'neutral-cli/validation.json'}.items():
            need(read(Path('recovery/artifacts', path))['succeeded'], name+' not successful')
            evidence[name] = Path('recovery/artifacts', path)
        with zipfile.ZipFile(out/'validation-evidence.zip', 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
            for name, path in evidence.items():
                archive.write(path, name)
        assets = [out/name for name in ('NewModCompiler-Win32-Debug.zip',
            'NewModCompiler-Win32-Release.zip', 'manifest.json', 'validation-evidence.zip')]
        identities = {p.name: (p.stat().st_size, hashlib.sha256(p.read_bytes()).hexdigest()) for p in assets}
        sums = out/'SHA256SUMS.txt'
        sums.write_text(''.join(digest+'  '+name+'\n' for name, (size, digest) in identities.items()), encoding='utf-8')
        assets.append(sums)
        identities[sums.name] = (sums.stat().st_size, hashlib.sha256(sums.read_bytes()).hexdigest())
        notes = out/'release-notes.txt'
        notes.write_text('\n'.join([
            '已修复打包过程中 MOD .bin/.imp/.relo 超过 2 GiB 时的整文件读取限制及 x86 多份内存复制问题。',
            '',
            'wu192/NewSdk 的 compiler-main 已包含上游修复 788566c0；本次从该仓库当前编译器源码重新构建，保留 XML 源码诊断。',
            '',
            '日常使用下载 NewModCompiler-Win32-Release.zip，解压后将三个文件放在同一目录：NewModCompiler.exe、NewModCompiler.exe.config、antlr.runtime.dll。SDK 和游戏资源另行提供。',
            '',
            'Windows x86 Debug/Release 均通过：2 GiB + 4 KiB resolver 到 BIG 回归、App 合同、原工具字节差分、真实 Core/CLI、小 MOD、最终 ZIP 独立解压编译及源码诊断。',
            'BIG 格式原有的 uint32 大小与偏移上限仍适用；未做完整大型 MOD 或游戏内验收。',
            '',
            'Source commit: '+source,
            'Validation: '+run_url,
            '校验值见 SHA256SUMS.txt，构建及运行文件身份见 manifest.json，精简验证记录见 validation-evidence.zip。',
            '']), encoding='utf-8')
        gh('release','create',tag,*assets,'--repo',repo,'--target',source,'--draft',
            '--title','NewModCompiler：BIG 超过 2GB 修复版','--notes-file',notes)
        release = json.loads(gh('api',f'repos/{repo}/releases/tags/{tag}'))
        need(len(release['assets']) == len(assets), 'Release asset count differs')
        for asset in release['assets']:
            size, digest = identities[asset['name']]
            need(asset['size'] == size and asset.get('digest') == 'sha256:'+digest,
                 'Release asset size/digest differs: '+asset['name'])
        gh('release','edit',tag,'--repo',repo,'--draft=false','--latest=false')
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
            summary.write(f"Published: https://github.com/{repo}/releases/tag/{tag}\n")
        print('Published '+tag)
    - name: Summarize CI evidence
      if: always()
      env:
        ARTIFACT_PATHS: |
          recovery/artifacts/neutral-app/*/*.log
          recovery/artifacts/neutral-product/*/build.json
          recovery/artifacts/neutral-product/*/link-inputs.json
          recovery/artifacts/neutral-product/*/validation/build.json
          recovery/artifacts/neutral-product/**/*.log
          recovery/artifacts/neutral-core/**/*.json
          recovery/artifacts/neutral-core/**/*.log
          recovery/artifacts/neutral-core/**/*.md
          recovery/artifacts/neutral-core/**/*.csv
          recovery/artifacts/neutral-core/**/*.tsv
          recovery/artifacts/neutral-cli/**/*.json
          recovery/artifacts/neutral-cli/**/*.log
          recovery/artifacts/neutral-cli/**/*.md
          recovery/artifacts/neutral-cli/**/*.csv
          recovery/artifacts/neutral-cli/**/*.tsv
          recovery/artifacts/neutral-components/**/*.json
          recovery/artifacts/neutral-components/**/*.log
          recovery/artifacts/neutral-components/**/*.md
          recovery/artifacts/neutral-components/**/*.csv
          recovery/artifacts/neutral-components/**/*.tsv
          recovery/artifacts/neutral-mod/**/*.json
          recovery/artifacts/neutral-mod/**/*.log
          recovery/artifacts/neutral-mod/**/*.md
          recovery/artifacts/neutral-mod/**/*.csv
          recovery/artifacts/neutral-mod/**/*.tsv
          recovery/artifacts/neutral-packages/**/*.json
          recovery/artifacts/neutral-packages/**/*.log
          recovery/artifacts/neutral-packages/**/*.md
          recovery/artifacts/neutral-packages/**/*.csv
          recovery/artifacts/neutral-packages/**/*.tsv
          !**/bin/**
          !**/test-work/**
          !**/baseline-streams/**
      run: python recovery/scripts/WriteCiSummary.py --title "CI evidence"
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: compiler-big-release-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          recovery/artifacts/neutral-app/*/*.log
          recovery/artifacts/neutral-product/*/build.json
          recovery/artifacts/neutral-product/*/link-inputs.json
          recovery/artifacts/neutral-product/*/validation/build.json
          recovery/artifacts/neutral-product/**/*.log
          recovery/artifacts/neutral-core/**/*.json
          recovery/artifacts/neutral-core/**/*.log
          recovery/artifacts/neutral-core/**/*.md
          recovery/artifacts/neutral-core/**/*.csv
          recovery/artifacts/neutral-core/**/*.tsv
          recovery/artifacts/neutral-cli/**/*.json
          recovery/artifacts/neutral-cli/**/*.log
          recovery/artifacts/neutral-cli/**/*.md
          recovery/artifacts/neutral-cli/**/*.csv
          recovery/artifacts/neutral-cli/**/*.tsv
          recovery/artifacts/neutral-components/**/*.json
          recovery/artifacts/neutral-components/**/*.log
          recovery/artifacts/neutral-components/**/*.md
          recovery/artifacts/neutral-components/**/*.csv
          recovery/artifacts/neutral-components/**/*.tsv
          recovery/artifacts/neutral-mod/**/*.json
          recovery/artifacts/neutral-mod/**/*.log
          recovery/artifacts/neutral-mod/**/*.md
          recovery/artifacts/neutral-mod/**/*.csv
          recovery/artifacts/neutral-mod/**/*.tsv
          recovery/artifacts/neutral-packages/**/*.json
          recovery/artifacts/neutral-packages/**/*.log
          recovery/artifacts/neutral-packages/**/*.md
          recovery/artifacts/neutral-packages/**/*.csv
          recovery/artifacts/neutral-packages/**/*.tsv
          !**/bin/**
          !**/test-work/**
          !**/baseline-streams/**
        retention-days: 1
        if-no-files-found: warn
'on':
  push:
    branches:
    - release/big-over-2g-20261106
    paths:
    - .github/workflows/compiler-big-release.yml
    - recovery/src/App/**
    - recovery/src/Managed/Core/**
    - recovery/tests/App/**
    - recovery/scripts/TestNeutralWorldbuilder.py
    - recovery/scripts/ImportWorldbuilderReferences.py
    - recovery/scripts/PackageNeutralCompiler.py
    - recovery/fixtures/neutral-worldbuilder/**
    - SDK/builtmods/sagexml/Worldbuilder*
    - SDK/builtmods/sagexml/Worldbuilder.bin.parts/**
  workflow_dispatch: null
