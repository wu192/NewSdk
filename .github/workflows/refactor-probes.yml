name: MOD compiler isolated probes
on:
  push:
    branches: [compiler-main, refactor/modcompiler-p0-p3]
    paths:
      - '.github/workflows/refactor-probes.yml'
      - 'recovery/probes/**'
      - 'recovery/build/**'
      - 'recovery/src/App/**'
      - 'recovery/src/Managed/**'
      - 'recovery/tests/App/**'
      - 'recovery/scripts/*SingleExeProbe.ps1'
      - 'recovery/scripts/*ManagedFoundation.ps1'
      - 'recovery/scripts/*App.ps1'
      - 'recovery/scripts/BuildCompiler.ps1'
      - 'recovery/scripts/TestCompiler.ps1'
      - 'recovery/src/Hosting/**'
      - 'recovery/tests/CompilerDeployment.cs'
      - 'recovery/scripts/TestTextureRedirect.ps1'
      - 'recovery/scripts/ConfirmRefactorBaseline.ps1'
      - 'recovery/scripts/ValidateAudioSourceTree.py'
      - 'recovery/tests/ValidateAudioSourceTree.test.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  texture-complete:
    if: contains(github.event.head_commit.message, '[refactor-texture-complete]')
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Prepare identical managed source ABI in a clean x86 host
        shell: pwsh
        run: |
          ./recovery/scripts/BuildManagedFoundation.ps1 -Configuration Release -OutputDirectory recovery/artifacts/texture-foundation
          ./recovery/scripts/BuildSingleExeProbe.ps1 -Configuration Release -FoundationDirectory recovery/artifacts/texture-foundation -OutputDirectory recovery/artifacts/texture-host
          Move-Item recovery/artifacts/texture-host/obj "$env:RUNNER_TEMP/texture-host-obj-$env:GITHUB_RUN_ID"
          Remove-Item recovery/artifacts/texture-foundation -Recurse -Force
      - name: Original, native roundtrip and EXE-bound Texture processing
        shell: pwsh
        run: |
          python -m pip install -r recovery/probes/TextureRedirect/requirements.txt
          if($LASTEXITCODE -ne 0){throw 'PE audit dependencies failed'}
          ./recovery/scripts/TestTextureRedirect.ps1 -OutputDirectory "recovery/evidence/refactor/g2-complete/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" -TargetExe recovery/artifacts/texture-host/bin/NewModCompiler.exe -RequireComplete
      - name: Summarize results and selected upload size
        if: always()
        env:
          ARTIFACT_PATHS: |
            recovery/evidence/refactor/g2-complete/${{ github.run_id }}-${{ github.run_attempt }}/**/*.json
            recovery/evidence/refactor/g2-complete/${{ github.run_id }}-${{ github.run_attempt }}/**/*.jsonl
            recovery/evidence/refactor/g2-complete/${{ github.run_id }}-${{ github.run_attempt }}/**/*.log
            recovery/evidence/refactor/g2-complete/${{ github.run_id }}-${{ github.run_attempt }}/**/*.txt
            recovery/evidence/refactor/g2-complete/${{ github.run_id }}-${{ github.run_attempt }}/**/*.md
            recovery/evidence/refactor/g2-complete/${{ github.run_id }}-${{ github.run_attempt }}/**/*.csv
            recovery/evidence/refactor/g2-complete/${{ github.run_id }}-${{ github.run_attempt }}/**/*.tsv
            recovery/artifacts/texture-host/*.log
            recovery/artifacts/texture-host/build.json
        run: python recovery/scripts/WriteCiSummary.py --title "Compiler isolated probes"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: refactor-texture-complete-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: |
            recovery/evidence/refactor/g2-complete/${{ github.run_id }}-${{ github.run_attempt }}/**/*.json
            recovery/evidence/refactor/g2-complete/${{ github.run_id }}-${{ github.run_attempt }}/**/*.jsonl
            recovery/evidence/refactor/g2-complete/${{ github.run_id }}-${{ github.run_attempt }}/**/*.log
            recovery/evidence/refactor/g2-complete/${{ github.run_id }}-${{ github.run_attempt }}/**/*.txt
            recovery/evidence/refactor/g2-complete/${{ github.run_id }}-${{ github.run_attempt }}/**/*.md
            recovery/evidence/refactor/g2-complete/${{ github.run_id }}-${{ github.run_attempt }}/**/*.csv
            recovery/evidence/refactor/g2-complete/${{ github.run_id }}-${{ github.run_attempt }}/**/*.tsv
            recovery/artifacts/texture-host/*.log
            recovery/artifacts/texture-host/build.json
          if-no-files-found: warn
  audio-source-identity:
    if: contains(github.event.head_commit.message, '[refactor-full]') || contains(github.event.head_commit.message, '[refactor-audio-path]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Strict source identity and rejection boundaries after relocation
        run: python recovery/tests/ValidateAudioSourceTree.test.py
  baseline-receipt:
    if: contains(github.event.head_commit.message, '[refactor-full]') || contains(github.event.head_commit.message, '[refactor-baseline-receipt]')
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: refactor-baseline-40269297741-1
          run-id: 40269297741
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: baseline-receipt
      - shell: pwsh
        run: ./recovery/scripts/ConfirmRefactorBaseline.ps1 -EvidenceDirectory baseline-receipt
  full-foundation:
    if: contains(github.event.head_commit.message, '[refactor-full]')
    needs: baseline-receipt
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Managed implementations, resource bytes and IL metadata
        shell: pwsh
        run: ./recovery/scripts/TestManagedFoundation.ps1 -FoundationDirectory recovery/artifacts/refactor-foundation
      - name: Complete Foundation and real Armor in isolated final x86 EXE
        shell: pwsh
        run: ./recovery/scripts/TestSingleExeProbe.ps1 -OutputDirectory "recovery/evidence/refactor/g1-full/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" -FoundationDirectory recovery/artifacts/refactor-foundation -BuildDirectory recovery/artifacts/refactor-link
      - name: Separate production CLI with managed source in EXE and no probe code
        shell: pwsh
        run: ./recovery/scripts/TestCompiler.ps1 -OutputDirectory "recovery/evidence/refactor/product/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" -FoundationDirectory recovery/artifacts/refactor-foundation -BuildDirectory recovery/artifacts/refactor-product
      - name: Texture original, roundtrip and EXE-bound processing
        shell: pwsh
        run: |
          python -m pip install -r recovery/probes/TextureRedirect/requirements.txt
          if($LASTEXITCODE -ne 0){throw 'PE audit dependencies failed'}
          ./recovery/scripts/TestTextureRedirect.ps1 -OutputDirectory "recovery/evidence/refactor/g2-full/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" -TargetExe recovery/artifacts/refactor-link/Release/bin/NewModCompiler.exe -RequireComplete
      - name: Summarize results and selected upload size
        if: always()
        env:
          ARTIFACT_PATHS: |
            recovery/evidence/refactor/managed/${{ github.run_id }}-${{ github.run_attempt }}/**/*.json
            recovery/evidence/refactor/managed/${{ github.run_id }}-${{ github.run_attempt }}/**/*.jsonl
            recovery/evidence/refactor/managed/${{ github.run_id }}-${{ github.run_attempt }}/**/*.log
            recovery/evidence/refactor/managed/${{ github.run_id }}-${{ github.run_attempt }}/**/*.txt
            recovery/evidence/refactor/managed/${{ github.run_id }}-${{ github.run_attempt }}/**/*.md
            recovery/evidence/refactor/managed/${{ github.run_id }}-${{ github.run_attempt }}/**/*.csv
            recovery/evidence/refactor/managed/${{ github.run_id }}-${{ github.run_attempt }}/**/*.tsv
            recovery/evidence/refactor/g1-full/${{ github.run_id }}-${{ github.run_attempt }}/**/*.json
            recovery/evidence/refactor/g1-full/${{ github.run_id }}-${{ github.run_attempt }}/**/*.jsonl
            recovery/evidence/refactor/g1-full/${{ github.run_id }}-${{ github.run_attempt }}/**/*.log
            recovery/evidence/refactor/g1-full/${{ github.run_id }}-${{ github.run_attempt }}/**/*.txt
            recovery/evidence/refactor/g1-full/${{ github.run_id }}-${{ github.run_attempt }}/**/*.md
            recovery/evidence/refactor/g1-full/${{ github.run_id }}-${{ github.run_attempt }}/**/*.csv
            recovery/evidence/refactor/g1-full/${{ github.run_id }}-${{ github.run_attempt }}/**/*.tsv
            recovery/evidence/refactor/g2-full/${{ github.run_id }}-${{ github.run_attempt }}/**/*.json
            recovery/evidence/refactor/g2-full/${{ github.run_id }}-${{ github.run_attempt }}/**/*.jsonl
            recovery/evidence/refactor/g2-full/${{ github.run_id }}-${{ github.run_attempt }}/**/*.log
            recovery/evidence/refactor/g2-full/${{ github.run_id }}-${{ github.run_attempt }}/**/*.txt
            recovery/evidence/refactor/g2-full/${{ github.run_id }}-${{ github.run_attempt }}/**/*.md
            recovery/evidence/refactor/g2-full/${{ github.run_id }}-${{ github.run_attempt }}/**/*.csv
            recovery/evidence/refactor/g2-full/${{ github.run_id }}-${{ github.run_attempt }}/**/*.tsv
            recovery/evidence/refactor/product/${{ github.run_id }}-${{ github.run_attempt }}/**/*.json
            recovery/evidence/refactor/product/${{ github.run_id }}-${{ github.run_attempt }}/**/*.jsonl
            recovery/evidence/refactor/product/${{ github.run_id }}-${{ github.run_attempt }}/**/*.log
            recovery/evidence/refactor/product/${{ github.run_id }}-${{ github.run_attempt }}/**/*.txt
            recovery/evidence/refactor/product/${{ github.run_id }}-${{ github.run_attempt }}/**/*.md
            recovery/evidence/refactor/product/${{ github.run_id }}-${{ github.run_attempt }}/**/*.csv
            recovery/evidence/refactor/product/${{ github.run_id }}-${{ github.run_attempt }}/**/*.tsv
        run: python recovery/scripts/WriteCiSummary.py --title "Compiler isolated probes"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: refactor-full-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: |
            recovery/evidence/refactor/managed/${{ github.run_id }}-${{ github.run_attempt }}/**/*.json
            recovery/evidence/refactor/managed/${{ github.run_id }}-${{ github.run_attempt }}/**/*.jsonl
            recovery/evidence/refactor/managed/${{ github.run_id }}-${{ github.run_attempt }}/**/*.log
            recovery/evidence/refactor/managed/${{ github.run_id }}-${{ github.run_attempt }}/**/*.txt
            recovery/evidence/refactor/managed/${{ github.run_id }}-${{ github.run_attempt }}/**/*.md
            recovery/evidence/refactor/managed/${{ github.run_id }}-${{ github.run_attempt }}/**/*.csv
            recovery/evidence/refactor/managed/${{ github.run_id }}-${{ github.run_attempt }}/**/*.tsv
            recovery/evidence/refactor/g1-full/${{ github.run_id }}-${{ github.run_attempt }}/**/*.json
            recovery/evidence/refactor/g1-full/${{ github.run_id }}-${{ github.run_attempt }}/**/*.jsonl
            recovery/evidence/refactor/g1-full/${{ github.run_id }}-${{ github.run_attempt }}/**/*.log
            recovery/evidence/refactor/g1-full/${{ github.run_id }}-${{ github.run_attempt }}/**/*.txt
            recovery/evidence/refactor/g1-full/${{ github.run_id }}-${{ github.run_attempt }}/**/*.md
            recovery/evidence/refactor/g1-full/${{ github.run_id }}-${{ github.run_attempt }}/**/*.csv
            recovery/evidence/refactor/g1-full/${{ github.run_id }}-${{ github.run_attempt }}/**/*.tsv
            recovery/evidence/refactor/g2-full/${{ github.run_id }}-${{ github.run_attempt }}/**/*.json
            recovery/evidence/refactor/g2-full/${{ github.run_id }}-${{ github.run_attempt }}/**/*.jsonl
            recovery/evidence/refactor/g2-full/${{ github.run_id }}-${{ github.run_attempt }}/**/*.log
            recovery/evidence/refactor/g2-full/${{ github.run_id }}-${{ github.run_attempt }}/**/*.txt
            recovery/evidence/refactor/g2-full/${{ github.run_id }}-${{ github.run_attempt }}/**/*.md
            recovery/evidence/refactor/g2-full/${{ github.run_id }}-${{ github.run_attempt }}/**/*.csv
            recovery/evidence/refactor/g2-full/${{ github.run_id }}-${{ github.run_attempt }}/**/*.tsv
            recovery/evidence/refactor/product/${{ github.run_id }}-${{ github.run_attempt }}/**/*.json
            recovery/evidence/refactor/product/${{ github.run_id }}-${{ github.run_attempt }}/**/*.jsonl
            recovery/evidence/refactor/product/${{ github.run_id }}-${{ github.run_attempt }}/**/*.log
            recovery/evidence/refactor/product/${{ github.run_id }}-${{ github.run_attempt }}/**/*.txt
            recovery/evidence/refactor/product/${{ github.run_id }}-${{ github.run_attempt }}/**/*.md
            recovery/evidence/refactor/product/${{ github.run_id }}-${{ github.run_attempt }}/**/*.csv
            recovery/evidence/refactor/product/${{ github.run_id }}-${{ github.run_attempt }}/**/*.tsv
          if-no-files-found: warn
  app-contract:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[refactor-probes]') || contains(github.event.head_commit.message, '[refactor-app]')
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: CLI plan, lifecycle and durable events in Debug and Release
        shell: pwsh
        run: |
          ./recovery/scripts/TestApp.ps1 -Configuration Debug
          ./recovery/scripts/TestApp.ps1 -Configuration Release
      - name: Summarize results and selected upload size
        if: always()
        env:
          ARTIFACT_PATHS: |
            recovery/artifacts/app/**/*.json
            recovery/artifacts/app/**/*.jsonl
            recovery/artifacts/app/**/*.log
            recovery/artifacts/app/**/*.txt
            recovery/artifacts/app/**/*.md
            recovery/artifacts/app/**/*.csv
            recovery/artifacts/app/**/*.tsv
        run: python recovery/scripts/WriteCiSummary.py --title "Compiler isolated probes"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: refactor-app-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: |
            recovery/artifacts/app/**/*.json
            recovery/artifacts/app/**/*.jsonl
            recovery/artifacts/app/**/*.log
            recovery/artifacts/app/**/*.txt
            recovery/artifacts/app/**/*.md
            recovery/artifacts/app/**/*.csv
            recovery/artifacts/app/**/*.tsv
          if-no-files-found: warn
  link-probe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[refactor-probes]') || contains(github.event.head_commit.message, '[refactor-link]')
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Real Armor and Hash unified-link differential
        shell: pwsh
        run: ./recovery/scripts/TestSingleExeProbe.ps1 -OutputDirectory "recovery/evidence/refactor/g1/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" -Minimal
      - name: Summarize results and selected upload size
        if: always()
        env:
          ARTIFACT_PATHS: |
            recovery/evidence/refactor/g1/${{ github.run_id }}-${{ github.run_attempt }}/**/*.json
            recovery/evidence/refactor/g1/${{ github.run_id }}-${{ github.run_attempt }}/**/*.jsonl
            recovery/evidence/refactor/g1/${{ github.run_id }}-${{ github.run_attempt }}/**/*.log
            recovery/evidence/refactor/g1/${{ github.run_id }}-${{ github.run_attempt }}/**/*.txt
            recovery/evidence/refactor/g1/${{ github.run_id }}-${{ github.run_attempt }}/**/*.md
            recovery/evidence/refactor/g1/${{ github.run_id }}-${{ github.run_attempt }}/**/*.csv
            recovery/evidence/refactor/g1/${{ github.run_id }}-${{ github.run_attempt }}/**/*.tsv
        run: python recovery/scripts/WriteCiSummary.py --title "Compiler isolated probes"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: refactor-link-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: |
            recovery/evidence/refactor/g1/${{ github.run_id }}-${{ github.run_attempt }}/**/*.json
            recovery/evidence/refactor/g1/${{ github.run_id }}-${{ github.run_attempt }}/**/*.jsonl
            recovery/evidence/refactor/g1/${{ github.run_id }}-${{ github.run_attempt }}/**/*.log
            recovery/evidence/refactor/g1/${{ github.run_id }}-${{ github.run_attempt }}/**/*.txt
            recovery/evidence/refactor/g1/${{ github.run_id }}-${{ github.run_attempt }}/**/*.md
            recovery/evidence/refactor/g1/${{ github.run_id }}-${{ github.run_attempt }}/**/*.csv
            recovery/evidence/refactor/g1/${{ github.run_id }}-${{ github.run_attempt }}/**/*.tsv
          if-no-files-found: warn
  texture-roundtrip:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[refactor-probes]') || contains(github.event.head_commit.message, '[refactor-texture]')
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Texture original and native-writer roundtrip
        shell: pwsh
        run: |
          python -m pip install -r recovery/probes/TextureRedirect/requirements.txt
          if($LASTEXITCODE -ne 0){throw 'PE audit dependencies failed'}
          ./recovery/scripts/TestTextureRedirect.ps1
      - name: Summarize results and selected upload size
        if: always()
        env:
          ARTIFACT_PATHS: |
            recovery/evidence/refactor/g2-${{ github.run_id }}-${{ github.run_attempt }}/**/*.json
            recovery/evidence/refactor/g2-${{ github.run_id }}-${{ github.run_attempt }}/**/*.jsonl
            recovery/evidence/refactor/g2-${{ github.run_id }}-${{ github.run_attempt }}/**/*.log
            recovery/evidence/refactor/g2-${{ github.run_id }}-${{ github.run_attempt }}/**/*.txt
            recovery/evidence/refactor/g2-${{ github.run_id }}-${{ github.run_attempt }}/**/*.md
            recovery/evidence/refactor/g2-${{ github.run_id }}-${{ github.run_attempt }}/**/*.csv
            recovery/evidence/refactor/g2-${{ github.run_id }}-${{ github.run_attempt }}/**/*.tsv
        run: python recovery/scripts/WriteCiSummary.py --title "Compiler isolated probes"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: refactor-texture-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: |
            recovery/evidence/refactor/g2-${{ github.run_id }}-${{ github.run_attempt }}/**/*.json
            recovery/evidence/refactor/g2-${{ github.run_id }}-${{ github.run_attempt }}/**/*.jsonl
            recovery/evidence/refactor/g2-${{ github.run_id }}-${{ github.run_attempt }}/**/*.log
            recovery/evidence/refactor/g2-${{ github.run_id }}-${{ github.run_attempt }}/**/*.txt
            recovery/evidence/refactor/g2-${{ github.run_id }}-${{ github.run_attempt }}/**/*.md
            recovery/evidence/refactor/g2-${{ github.run_id }}-${{ github.run_attempt }}/**/*.csv
            recovery/evidence/refactor/g2-${{ github.run_id }}-${{ github.run_attempt }}/**/*.tsv
          if-no-files-found: warn
