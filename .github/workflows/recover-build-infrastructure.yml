name: Recover Core Remote and EALABuild
on:
  push:
    branches: [recovery/core-remote-ealabuild]
    paths:
      - '.github/workflows/recover-build-infrastructure.yml'
      - 'recovery/scripts/RecoverBuildInfrastructure.ps1'
      - 'recovery/tests/BuildInfrastructureContract.cs'
      - 'recovery/scripts/TestBuildInfrastructure.ps1'
      - 'recovery/src/Managed/Core/**'
      - 'recovery/src/Managed/Remote/**'
      - 'recovery/src/Managed/EALABuild/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Export and build all three assemblies
        shell: pwsh
        run: ./recovery/scripts/RecoverBuildInfrastructure.ps1
      - name: Compare original and source-built contracts and behavior
        shell: pwsh
        run: ./recovery/scripts/TestBuildInfrastructure.ps1
      - name: Summarize CI evidence
        if: always()
        env:
          ARTIFACT_PATHS: |
            recovery/evidence/build-infrastructure/${{ github.run_id }}-${{ github.run_attempt }}/*.json
            recovery/evidence/build-infrastructure/${{ github.run_id }}-${{ github.run_attempt }}/*.log
            recovery/evidence/build-infrastructure/${{ github.run_id }}-${{ github.run_attempt }}/*difference*.txt
            recovery/evidence/build-infrastructure/validation/${{ github.run_id }}-${{ github.run_attempt }}/*.json
            recovery/evidence/build-infrastructure/validation/${{ github.run_id }}-${{ github.run_attempt }}/*.log
            recovery/evidence/build-infrastructure/validation/${{ github.run_id }}-${{ github.run_attempt }}/*difference*.txt
        run: python recovery/scripts/WriteCiSummary.py --title "CI evidence"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: 'build-infrastructure-${{ github.run_id }}-${{ github.run_attempt }}'
          path: |
            recovery/evidence/build-infrastructure/${{ github.run_id }}-${{ github.run_attempt }}/*.json
            recovery/evidence/build-infrastructure/${{ github.run_id }}-${{ github.run_attempt }}/*.log
            recovery/evidence/build-infrastructure/${{ github.run_id }}-${{ github.run_attempt }}/*difference*.txt
            recovery/evidence/build-infrastructure/validation/${{ github.run_id }}-${{ github.run_attempt }}/*.json
            recovery/evidence/build-infrastructure/validation/${{ github.run_id }}-${{ github.run_attempt }}/*.log
            recovery/evidence/build-infrastructure/validation/${{ github.run_id }}-${{ github.run_attempt }}/*difference*.txt
          retention-days: 1
          if-no-files-found: warn
      - name: Save source and evidence
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- recovery/src/Managed/Core recovery/src/Managed/Remote recovery/src/Managed/EALABuild recovery/evidence/build-infrastructure
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Preserve Core Remote EALABuild source and build evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
          git pull --rebase origin $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Concurrent update; artifact retained' }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Push failed; artifact retained' }
