name: Recover compiler evidence
on:
  push:
    branches: [recovery/compiler-source]
    paths:
      - '.github/workflows/recover-compilers.yml'
      - 'recovery/scripts/Extract.ps1'
      - 'recovery/MetadataInventory/**'
permissions:
  contents: write
jobs:
  extract:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Install pinned decompiler
        run: dotnet tool install ilspycmd --tool-path recovery/toolbin --version 9.1.0.7988
      - name: Extract managed source and native evidence
        shell: pwsh
        run: ./recovery/scripts/Extract.ps1
      - name: Summarize CI evidence
        if: always()
        env:
          ARTIFACT_PATHS: |
            recovery/evidence/BinaryAssetBuilder.Tokenizer/extraction.json
            recovery/evidence/BinaryAssetBuilder.Tokenizer/summary.json
            recovery/evidence/BinaryAssetBuilder.Tokenizer/pe.txt
            recovery/logs/BinaryAssetBuilder.Tokenizer.decompile.txt
            recovery/evidence/BinaryAssetBuilder.XmlCompiler/extraction.json
            recovery/evidence/BinaryAssetBuilder.XmlCompiler/summary.json
            recovery/evidence/BinaryAssetBuilder.XmlCompiler/pe.txt
            recovery/logs/BinaryAssetBuilder.XmlCompiler.decompile.txt
            recovery/evidence/EALAModStudio/extraction.json
            recovery/evidence/EALAModStudio/summary.json
            recovery/evidence/EALAModStudio/pe.txt
            recovery/logs/EALAModStudio.decompile.txt
            recovery/evidence/BinaryAssetBuilder.Core/extraction.json
            recovery/evidence/BinaryAssetBuilder.Core/summary.json
            recovery/evidence/BinaryAssetBuilder.Core/pe.txt
            recovery/logs/BinaryAssetBuilder.Core.decompile.txt
            recovery/evidence/BinaryAssetBuilder/extraction.json
            recovery/evidence/BinaryAssetBuilder/summary.json
            recovery/evidence/BinaryAssetBuilder/pe.txt
            recovery/logs/BinaryAssetBuilder.decompile.txt
        run: python recovery/scripts/WriteCiSummary.py --title "CI evidence"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: 'compiler-recovery-evidence'
          path: |
            recovery/evidence/BinaryAssetBuilder.Tokenizer/extraction.json
            recovery/evidence/BinaryAssetBuilder.Tokenizer/summary.json
            recovery/evidence/BinaryAssetBuilder.Tokenizer/pe.txt
            recovery/logs/BinaryAssetBuilder.Tokenizer.decompile.txt
            recovery/evidence/BinaryAssetBuilder.XmlCompiler/extraction.json
            recovery/evidence/BinaryAssetBuilder.XmlCompiler/summary.json
            recovery/evidence/BinaryAssetBuilder.XmlCompiler/pe.txt
            recovery/logs/BinaryAssetBuilder.XmlCompiler.decompile.txt
            recovery/evidence/EALAModStudio/extraction.json
            recovery/evidence/EALAModStudio/summary.json
            recovery/evidence/EALAModStudio/pe.txt
            recovery/logs/EALAModStudio.decompile.txt
            recovery/evidence/BinaryAssetBuilder.Core/extraction.json
            recovery/evidence/BinaryAssetBuilder.Core/summary.json
            recovery/evidence/BinaryAssetBuilder.Core/pe.txt
            recovery/logs/BinaryAssetBuilder.Core.decompile.txt
            recovery/evidence/BinaryAssetBuilder/extraction.json
            recovery/evidence/BinaryAssetBuilder/summary.json
            recovery/evidence/BinaryAssetBuilder/pe.txt
            recovery/logs/BinaryAssetBuilder.decompile.txt
          retention-days: 1
          if-no-files-found: warn
      - name: Save extracted results to branch
        if: success()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovery/decompiled recovery/evidence recovery/logs
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'recovery: preserve decompiled managed sources and mixed-mode method inventory'
          git pull --rebase origin recovery/compiler-source
          git push origin HEAD:recovery/compiler-source
