name: XmlCompiler priority type differential validation

on:
  workflow_dispatch:
    inputs:
      groups:
        description: 'Optional comma-separated groups to explicitly validate; unchanged successful groups are reused by default'
        required: false
        default: ''
  push:
    branches: [recovery/xmlcompiler-priority, recovery/compiler-source]
    paths:
      - '.github/workflows/recovered-xmlcompiler-priority.yml'
      - 'recovery/src/**/Xml*'
      - 'recovery/src/Native/AttributeModifier.*'
      - 'recovery/src/Native/UpgradeTemplate.*'
      - 'recovery/src/Native/LogicCommandSet.*'
      - 'recovery/src/Native/FX*'
      - 'recovery/src/Native/SpecialPowerTemplate.*'
      - 'recovery/src/Native/ObjectCreationList.*'
      - 'recovery/src/Native/LocomotorTemplate.*'
      - 'recovery/src/Native/AI*'
      - 'recovery/tests/Xml*Oracle.cs'
      - 'recovery/tests/Xml*Cases.cs'
      - 'recovery/scripts/TestXml*.ps1'
      - 'recovery/scripts/AuditXmlComponentCatalog.py'
      - 'recovery/scripts/SelectXmlComponentGroups.py'
      - 'recovery/tests/test_select_xml_groups.py'
      - 'recovery/catalog/Xml*Types.json'
      - 'recovery/src/Native/Relocation.*'
      - 'recovery/src/Native/ScalarParsing.*'
      - 'recovery/src/Native/DataInitializers.*'
      - 'recovery/src/Native/ResourceMarshaling.*'
      - 'recovery/src/Native/EnumBitset.*'
      - 'recovery/src/Native/ObjectFilter.*'
      - 'recovery/src/Bridge/XmlNodeAdapter.h'
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
      link_ready: ${{ steps.groups.outputs.link_ready }}
      link_roots: ${{ steps.groups.outputs.link_roots }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify affected-group selection without compiler runs
        run: python -m unittest discover -s recovery/tests -p test_select_xml_groups.py -q
      - name: Audit exact original registration and formal component catalogs
        run: python recovery/scripts/AuditXmlComponentCatalog.py
      - id: groups
        name: Reuse unchanged successful matrices and select affected groups
        env:
          XML_REQUESTED_GROUPS: ${{ inputs.groups || '' }}
        shell: python
        run: |
          import importlib.util, json, os, pathlib
          path = pathlib.Path('recovery/scripts/SelectXmlComponentGroups.py')
          spec = importlib.util.spec_from_file_location('xml_selection', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          forced = [g.strip() for g in os.environ.get('XML_REQUESTED_GROUPS', '').split(',') if g.strip()]
          result = module.select(pathlib.Path.cwd(), force_groups=forced)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('groups=' + json.dumps(result['groups']) + '\n')
              stream.write('link_ready=' + str(result['link_ready']).lower() + '\n')
              stream.write('link_roots=' + json.dumps(result['link_roots']) + '\n')
          print(json.dumps(result, ensure_ascii=False, indent=2))

  differential:
    needs: inventory
    if: needs.inventory.outputs.groups != '[]'
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.inventory.outputs.groups) }}
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Compare recovered group against original XmlCompiler
        shell: pwsh
        env:
          XML_GROUP: ${{ matrix.group }}
        run: |
          & "./recovery/scripts/TestXml$env:XML_GROUP.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Group $env:XML_GROUP failed" }
          $path = "recovery/evidence/xml-$env:XML_GROUP/validation.json"
          $result = Get-Content $path -Raw | ConvertFrom-Json
          if ($result.succeeded -ne $true -or $result.sourceCommit -ne $env:GITHUB_SHA -or [string]$result.runId -ne $env:GITHUB_RUN_ID) {
            throw 'Missing or mismatched validation evidence'
          }
      - name: Summarize results and selected upload size
        if: always()
        env:
          ARTIFACT_PATHS: |
            recovery/evidence/xml-${{ matrix.group }}/**/*.json
            recovery/evidence/xml-${{ matrix.group }}/**/*.jsonl
            recovery/evidence/xml-${{ matrix.group }}/**/*.log
            recovery/evidence/xml-${{ matrix.group }}/**/*.txt
            recovery/evidence/xml-${{ matrix.group }}/**/*.md
            recovery/evidence/xml-${{ matrix.group }}/**/*.csv
            recovery/evidence/xml-${{ matrix.group }}/**/*.tsv
        run: python recovery/scripts/WriteCiSummary.py --title "XML priority validation"
      # Small reports and oracle text logs are required by the same-run evidence aggregation job.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xml-priority-${{ matrix.group }}
          retention-days: 1
          path: |
            recovery/evidence/xml-${{ matrix.group }}/**/*.json
            recovery/evidence/xml-${{ matrix.group }}/**/*.jsonl
            recovery/evidence/xml-${{ matrix.group }}/**/*.log
            recovery/evidence/xml-${{ matrix.group }}/**/*.txt
            recovery/evidence/xml-${{ matrix.group }}/**/*.md
            recovery/evidence/xml-${{ matrix.group }}/**/*.csv
            recovery/evidence/xml-${{ matrix.group }}/**/*.tsv
          if-no-files-found: warn
  link:
    needs: [inventory, differential]
    if: always() && needs.inventory.result == 'success' && needs.inventory.outputs.link_ready == 'true' && (needs.differential.result == 'success' || needs.differential.result == 'skipped')
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Check all public routes and compare only affected roots
        shell: pwsh
        env:
          XML_LINK_ROOTS: ${{ needs.inventory.outputs.link_roots }}
        run: ./recovery/scripts/TestXmlPriorityLink.ps1
      - name: Summarize results and selected upload size
        if: always()
        env:
          ARTIFACT_PATHS: |
            recovery/evidence/xml-priority-link/**/*.json
            recovery/evidence/xml-priority-link/**/*.jsonl
            recovery/evidence/xml-priority-link/**/*.log
            recovery/evidence/xml-priority-link/**/*.txt
            recovery/evidence/xml-priority-link/**/*.md
            recovery/evidence/xml-priority-link/**/*.csv
            recovery/evidence/xml-priority-link/**/*.tsv
        run: python recovery/scripts/WriteCiSummary.py --title "XML priority validation"
      # Small reports and oracle text logs are required by the same-run evidence aggregation job.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xml-priority-priority-link
          retention-days: 1
          path: |
            recovery/evidence/xml-priority-link/**/*.json
            recovery/evidence/xml-priority-link/**/*.jsonl
            recovery/evidence/xml-priority-link/**/*.log
            recovery/evidence/xml-priority-link/**/*.txt
            recovery/evidence/xml-priority-link/**/*.md
            recovery/evidence/xml-priority-link/**/*.csv
            recovery/evidence/xml-priority-link/**/*.tsv
          if-no-files-found: warn
      # Seven days for explicit cross-run SDK compiler reuse; contains only the linked compiler DLLs.
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: recovered-xmlcompiler-priority-x86
          retention-days: 7
          path: |
            ${{ runner.temp }}/ra3-recovered-xml-priority-link/**/Recovered.XmlCompilerPriority.dll
          if-no-files-found: error
  evidence:
    needs: [inventory, differential, link]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.differential.result != 'skipped' || needs.link.result != 'skipped'
        with:
          pattern: xml-priority-*
          path: /tmp/xml-priority-results
      - name: Preserve complete validation logs
        if: needs.differential.result != 'skipped' || needs.link.result != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          for group in attributes effects powers locomotor ai fxparticle progression environment players damagefx hotkeymaps audio uisettings soundmaps tacticalhotkeys uichat uidecals singlesound pathmusic musicscript uitactical conditions targeting evaachievement healthbars unitoverlay objectsets visibility emotions projectilepath forcefeedback content visualsystems crowd radar renderdevice localization commandset materialrules uiimages chatcolors moviearchive systemsettings campaign buildeconomy dynamics connections redalert conquercards armyopening assetindexes renderassets aptdata runtimeopaque mouse abilitybuttons testtextures terrain w3d mapmetadata gamescripts gamemap uiconfig priority-link; do
            src="/tmp/xml-priority-results/xml-priority-$group"
            if [ -d "$src" ]; then
              mkdir -p "recovery/evidence/xml-$group"
              cp -a "$src/." "recovery/evidence/xml-$group/"
            fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovery/evidence/xml-*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "recovery: record XmlCompiler priority validation for $GITHUB_SHA"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Require all differential groups to pass
        env:
          DIFFERENTIAL_RESULT: ${{ needs.differential.result }}
          SELECTED_GROUPS: ${{ needs.inventory.outputs.groups }}
          LINK_READY: ${{ needs.inventory.outputs.link_ready }}
          LINK_RESULT: ${{ needs.link.result }}
        run: |
          if [ "$SELECTED_GROUPS" != '[]' ]; then test "$DIFFERENTIAL_RESULT" = success; else test "$DIFFERENTIAL_RESULT" = skipped; fi
          if [ "$LINK_READY" = true ]; then test "$LINK_RESULT" = success; else test "$LINK_RESULT" = skipped; fi



