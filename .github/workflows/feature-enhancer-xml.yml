name: Native Enhancer XML component validation
on:
  push:
    branches: [feature/integration, codex/native-dozer-commandset, feature/passive-mind-control-tower, feature/ra3-repair-dock]
    paths:
      - '.github/workflows/feature-enhancer-xml.yml'
      - 'recovery/scripts/TestEnhancerDozerXml.ps1'
      - 'recovery/src/Native/GameObject*'
      - 'recovery/src/Native/Relocation.*'
      - 'recovery/src/Native/ScalarParsing.*'
      - 'recovery/src/Native/DataInitializers.*'
      - 'recovery/src/Native/ResourceMarshaling.*'
      - 'recovery/src/Native/EnumBitset.*'
      - 'recovery/src/Native/ObjectFilter.*'
      - 'recovery/src/Native/WeaponSlotOrder.*'
      - 'recovery/src/Bridge/GameObjectCompiler.cpp'
      - 'recovery/src/Plugin/GameObjectPlugin.cs'
      - 'recovery/src/App/Application/BuiltinCompilers.cs'
      - 'recovery/src/Managed/Core/**'
      - 'recovery/tests/GameObjectDozer*'
      - 'recovery/tests/GameObjectPassiveMindControl*'
      - 'recovery/tests/GameObjectRepairDock*'
      - 'recovery/tests/PluginSchemaBoundary.cs'
      - 'examples/passive-mind-control/**'
      - 'examples/repair-dock/**'
      - 'SDK/Schemas/xsd/CnC3Types.xsd'
      - 'SDK/Schemas/xsd/AssetTypeGameObject.xsd'
      - 'SDK/Schemas/xsd/Modules/DozerAIUpdate.xsd'
      - 'SDK/Schemas/xsd/Modules/PassiveMindControlUpdate.xsd'
      - 'SDK/Schemas/xsd/Modules/RepairDockUpdate.xsd'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-dozer-components-${{ github.ref }}
  cancel-in-progress: false
jobs:
  components:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            recovery/src
            recovery/tests
            recovery/scripts
            recovery/tools
            SDK/Schemas
            SDK/tools
            examples/passive-mind-control
            examples/repair-dock
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Compile and exercise production native and XML bridge paths
        shell: pwsh
        run: ./recovery/scripts/TestEnhancerDozerXml.ps1 -OutputDirectory "${{ runner.temp }}/enhancer-dozer-xml"
      - name: Record exact source and component evidence in logs and summary
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:RUNNER_TEMP 'enhancer-dozer-xml/validation.json'
          if (!(Test-Path $path)) { throw 'Component receipt unavailable; see the failed validation step.' }
          $json = Get-Content $path -Raw
          Write-Host $json
          '## Native Dozer, passive mind control and RepairDock component evidence' >> $env:GITHUB_STEP_SUMMARY
          'Win32 /Od and /O2 serializer, XML bridge, source-built Core repair expressions/schema/TypeId injection, production examples and focused original-DLL three-buffer compatibility; not full SDK/MOD or game validation.' >> $env:GITHUB_STEP_SUMMARY
          '```json' >> $env:GITHUB_STEP_SUMMARY
          $json >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          # Receipts include test summaries, elapsed time, and fixture identities.
          # Keep evidence in the run log and summary; upload no artifacts or caches.
