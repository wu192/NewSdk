name: Native Dozer serializer and XML component validation
on:
  push:
    branches: [feature/integration, codex/native-dozer-commandset]
    paths:
      - '.github/workflows/feature-enhancer-xml.yml'
      - 'recovery/scripts/TestEnhancerDozerXml.ps1'
      - 'recovery/src/Native/GameObject*'
      - 'recovery/src/Native/Relocation.*'
      - 'recovery/src/Native/ScalarParsing.*'
      - 'recovery/src/Native/DataInitializers.*'
      - 'recovery/src/Native/ResourceMarshaling.*'
      - 'recovery/src/Native/EnumBitset.*'
      - 'recovery/src/Native/ObjectFilter.*'
      - 'recovery/src/Native/WeaponSlotOrder.*'
      - 'recovery/src/Bridge/GameObjectCompiler.cpp'
      - 'recovery/tests/GameObjectDozer*'
      - 'recovery/tests/PluginSchemaBoundary.cs'
      - 'SDK/Schemas/xsd/AssetTypeGameObject.xsd'
      - 'SDK/Schemas/xsd/Modules/DozerAIUpdate.xsd'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-dozer-components-${{ github.ref }}
  cancel-in-progress: false
jobs:
  components:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            recovery/src
            recovery/tests
            recovery/scripts
            SDK/Schemas
            SDK/tools
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Compile and exercise production native and XML bridge paths
        shell: pwsh
        run: ./recovery/scripts/TestEnhancerDozerXml.ps1 -OutputDirectory "${{ runner.temp }}/enhancer-dozer-xml"
      - name: Preserve exact source and component evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-dozer-components-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
          path: |
            ${{ runner.temp }}/enhancer-dozer-xml/validation.json
            ${{ runner.temp }}/enhancer-dozer-xml/**/*.log
            ${{ runner.temp }}/enhancer-dozer-xml/**/fixtures/*
