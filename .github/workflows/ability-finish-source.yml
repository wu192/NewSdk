name: Extract remaining SpecialAbility original methods
on:
  push:
    branches: [recovery/compiler-source]
    paths:
      - 'recovery/scripts/ExportAbilityFinishMethods.py'
      - 'recovery/scripts/ExportAttachNextMethods.py'
      - '.github/workflows/ability-finish-source.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python recovery/scripts/ExportAbilityFinishMethods.py
      - run: python recovery/scripts/ExportAttachNextMethods.py
      - name: Emit bounded original methods for review
        run: |
          python - <<'PYCODE'
          import json,pathlib
          p=pathlib.Path('recovery/evidence/gameobject-modules/ability-finish-source')
          print('ORIGINAL_METHOD_ARCHIVE='+json.dumps({str(f):f.read_text() for f in sorted(p.iterdir())}))
          p=pathlib.Path('recovery/evidence/gameobject-modules/attach-next-source')
          print('ATTACH_METHOD_ARCHIVE='+json.dumps({str(f):f.read_text() for f in sorted(p.iterdir())}))
          PYCODE
      - name: Summarize CI evidence
        if: always()
        env:
          ARTIFACT_PATHS: |
            recovery/evidence/gameobject-modules/ability-finish-source/manifest.json
            recovery/evidence/gameobject-modules/ability-finish-source/*.txt
            recovery/evidence/gameobject-modules/attach-next-source/manifest.json
            recovery/evidence/gameobject-modules/attach-next-source/*.txt
        run: python recovery/scripts/WriteCiSummary.py --title "CI evidence"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: 'original-ability-finish-source'
          path: |
            recovery/evidence/gameobject-modules/ability-finish-source/manifest.json
            recovery/evidence/gameobject-modules/ability-finish-source/*.txt
            recovery/evidence/gameobject-modules/attach-next-source/manifest.json
            recovery/evidence/gameobject-modules/attach-next-source/*.txt
          retention-days: 1
          if-no-files-found: warn
