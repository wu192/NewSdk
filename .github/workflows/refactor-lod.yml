name: Prepared RA3 LoD original differential
on:
  push:
    branches: [compiler-main, refactor/modcompiler-p0-p3]
    paths:
      - '.github/workflows/refactor-lod.yml'
      - 'recovery/preparation/lod/**'
      - 'recovery/src/App/Application/LoDStreamBuilder.cs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lod:
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            recovery/preparation/lod
            recovery/src/App/Application
            SDK/tools
            SDK/builtmods
      - name: Preserve repeated original LoD tail-byte diagnostic
        shell: pwsh
        run: |
          python recovery/preparation/lod/TestCompilerLoD.py --probe-original --original SDK/tools/LoDStreamBuilder.exe --output recovery/artifacts/lod/original-tail-probe
          if($LASTEXITCODE -ne 0){throw 'Original LoD diagnostic execution failed'}
      - name: Build prepared in-process LoD component in both configurations
        shell: pwsh
        run: |
          $vs=& "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.Component.MSBuild -property installationPath
          $csc=Join-Path $vs 'MSBuild/Current/Bin/Roslyn/csc.exe'
          foreach($mode in @('Debug','Release')) {
            $out="recovery/artifacts/lod/$mode";New-Item -ItemType Directory -Force $out|Out-Null
            $opt=if($mode -eq 'Release'){'/optimize+'}else{'/debug:full'}
            & $csc /nologo /target:exe /platform:x86 /langversion:7.3 $opt "/out:$out/LoDControl.exe" recovery/src/App/Application/LoDStreamBuilder.cs recovery/preparation/lod/LoDControl.cs
            if($LASTEXITCODE -ne 0){throw 'Prepared LoD component compilation failed'}
            python recovery/preparation/lod/TestCompilerLoD.py --original SDK/tools/LoDStreamBuilder.exe --candidate "$out/LoDControl.exe" --output "$out/evidence" --real-manifest SDK/builtmods/Static.manifest --real-manifest SDK/builtmods/sagexml/Worldbuilder.manifest
            if($LASTEXITCODE -ne 0){throw 'Original LoD component differential failed'}
          }
      - name: Summarize CI evidence
        if: always()
        env:
          ARTIFACT_PATHS: |
            recovery/artifacts/lod/**/*.json
            recovery/artifacts/lod/**/*.log
            recovery/artifacts/lod/**/*.md
            recovery/artifacts/lod/**/*.csv
            recovery/artifacts/lod/**/*.tsv
            !**/bin/**
            !**/test-work/**
            !**/baseline-streams/**
        run: python recovery/scripts/WriteCiSummary.py --title "CI evidence"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: 'prepared-lod-${{ github.run_id }}-${{ github.run_attempt }}'
          path: |
            recovery/artifacts/lod/**/*.json
            recovery/artifacts/lod/**/*.log
            recovery/artifacts/lod/**/*.md
            recovery/artifacts/lod/**/*.csv
            recovery/artifacts/lod/**/*.tsv
            !**/bin/**
            !**/test-work/**
            !**/baseline-streams/**
          retention-days: 1
          if-no-files-found: warn
