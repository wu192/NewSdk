name: Recovered Utility validation
on:
  push:
    branches: [recovery/utility-source, recovery/compiler-source]
    paths:
      - '.github/workflows/recovered-utility.yml'
      - 'recovery/src/Managed/Utility/**'
      - 'recovery/tools/UtilityIdentity/**'
      - 'recovery/scripts/TestUtility.ps1'
      - 'recovery/tests/UtilityOracle.cs'
      - 'SDK/tools/BinaryAssetBuilder.Utility.dll'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: utility-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and compare Utility with original
        shell: pwsh
        run: ./recovery/scripts/TestUtility.ps1
      - name: Summarize CI evidence
        if: always()
        env:
          ARTIFACT_PATHS: |
            recovery/evidence/utility/validation/${{ github.run_id }}-${{ github.run_attempt }}/**/*.json
            recovery/evidence/utility/validation/${{ github.run_id }}-${{ github.run_attempt }}/**/*.log
            recovery/evidence/utility/validation/${{ github.run_id }}-${{ github.run_attempt }}/**/*.md
            recovery/evidence/utility/validation/${{ github.run_id }}-${{ github.run_attempt }}/**/*.csv
            recovery/evidence/utility/validation/${{ github.run_id }}-${{ github.run_attempt }}/**/*.tsv
            !**/bin/**
            !**/test-work/**
            !**/baseline-streams/**
        run: python recovery/scripts/WriteCiSummary.py --title "CI evidence"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: 'utility-validation-${{ github.run_id }}-${{ github.run_attempt }}'
          path: |
            recovery/evidence/utility/validation/${{ github.run_id }}-${{ github.run_attempt }}/**/*.json
            recovery/evidence/utility/validation/${{ github.run_id }}-${{ github.run_attempt }}/**/*.log
            recovery/evidence/utility/validation/${{ github.run_id }}-${{ github.run_attempt }}/**/*.md
            recovery/evidence/utility/validation/${{ github.run_id }}-${{ github.run_attempt }}/**/*.csv
            recovery/evidence/utility/validation/${{ github.run_id }}-${{ github.run_attempt }}/**/*.tsv
            !**/bin/**
            !**/test-work/**
            !**/baseline-streams/**
          retention-days: 1
          if-no-files-found: warn
      - name: Preserve successful validation
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "recovery/evidence/utility/validation/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Preserve Utility validation $env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($LASTEXITCODE -ne 0) { throw 'Evidence commit failed' }
          git pull --rebase origin $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Concurrent changes require resolution' }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Evidence push failed' }
