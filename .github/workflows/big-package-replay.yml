name: Package validated BIG memory fix
on:
  push:
    branches: [fix/big-streaming-over-2gb]
    paths: ['.github/workflows/big-package-replay.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      # Keep the exact product source identity. Only the workflow changes here.
      # Full history/blobs are needed by the pinned original UI fixture exporter.
      - uses: actions/checkout@v4
        with:
          ref: 788566c07449eb0e223ad21e64bc28d15c3d8c56
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41434055130
          name: neutral-worldbuilder-41434055130-1
          path: recovery/artifacts
      - name: Verify unchanged product and successful Core evidence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source='788566c07449eb0e223ad21e64bc28d15c3d8c56'
          if((git rev-parse HEAD).Trim() -cne $source){throw 'Source checkout differs from product'}
          $core=Get-Content recovery/artifacts/neutral-core/validation.json -Raw|ConvertFrom-Json
          if(!$core.succeeded -or $core.sourceCommit -cne $source -or $core.runId -ne '41434055130'){throw 'Core evidence is not the accepted source run'}
          foreach($mode in @('Debug','Release')) {
            $product="recovery/artifacts/neutral-product/$mode"
            $receipt=Get-Content "$product/build.json" -Raw|ConvertFrom-Json
            $validationReceipt=Get-Content "$product/validation/build.json" -Raw|ConvertFrom-Json
            $actual=(Get-FileHash "$product/bin/NewModCompiler.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
            if($receipt.sourceCommit -cne $source -or $receipt.configuration -cne $mode -or $receipt.exeSha256 -cne $actual -or $validationReceipt.productExeSha256 -cne $actual){throw "$mode product/source identity mismatch"}
            foreach($sourceEntry in $receipt.sources) {
              if((Get-FileHash $sourceEntry.path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $sourceEntry.sha256){throw "Product source changed: $($sourceEntry.path)"}
            }
          }
          Move-Item recovery/artifacts/neutral-cli recovery/artifacts/neutral-cli-original-failure
          @{schemaVersion=1;binarySourceCommit=$source;binaryBuildRunId='41434055130';coreValidationRunId='41434055130';workflowCommit='${{ github.sha }}';replayRunId='${{ github.run_id }}';scope='Reuse exact successful products/Core; rerun unchanged CLI and final small MOD/ZIP gates'} | ConvertTo-Json | Set-Content recovery/artifacts/replay-inputs.json
          python -m pip install lxml==6.0.2
          if($LASTEXITCODE -ne 0){throw 'Schema dependency installation failed'}
      - name: Real CLI success failure cancellation and retry
        shell: pwsh
        run: ./recovery/scripts/TestCompilerCli.ps1 -CompilerDirectory recovery/artifacts/neutral-product -OutputDirectory recovery/artifacts/neutral-cli
      - name: Official neutral small MOD and original raw BIG differential
        shell: pwsh
        run: |
          foreach($mode in @('Debug','Release')) {
            python recovery/scripts/TestNeutralWorldbuilder.py --product-build "recovery/artifacts/neutral-product/$mode" --configuration $mode --output "recovery/artifacts/neutral-mod/$mode"
            if($LASTEXITCODE -ne 0){throw "$mode original neutral chain failed"}
          }
      - name: Final ZIP packaging and independent extracted runtime validation
        shell: pwsh
        run: |
          python recovery/scripts/PackageNeutralCompiler.py --product-root recovery/artifacts/neutral-product --validation-root recovery/artifacts/neutral-mod --output recovery/artifacts/neutral-packages
          if($LASTEXITCODE -ne 0){throw 'Final ZIP deployment validation failed'}
      - uses: actions/upload-artifact@v4
        with:
          name: NewModCompiler-BIG2GB-Win32
          path: |
            recovery/artifacts/neutral-packages/*.zip
            recovery/artifacts/neutral-packages/manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: big-package-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery/artifacts/replay-inputs.json
            recovery/artifacts/neutral-product/*/build.json
            recovery/artifacts/neutral-core/validation.json
            recovery/artifacts/neutral-cli/
            recovery/artifacts/neutral-mod/
            recovery/artifacts/neutral-packages/
          if-no-files-found: warn
