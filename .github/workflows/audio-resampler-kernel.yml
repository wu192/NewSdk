name: Audio resampler kernel validation
on:
  push:
    branches: [recovery/audio-compiler-source]
    paths:
      - '.github/workflows/audio-resampler-kernel.yml'
      - 'recovery/src/Managed/Audio/Native/Resampler*.cs'
      - 'recovery/scripts/TestAudioResampler.ps1'
      - 'recovery/scripts/GenerateAudioResampler*.py'
      - 'recovery/tests/Audio*Resampler*.cs'
      - 'recovery/evidence/audio/native-resampler/**'
      - 'SDK/tools/BinaryAssetBuilder.AudioCompiler.dll'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audio-resampler-${{ github.ref }}
  cancel-in-progress: false
jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate original-machine-code oracle on pinned Linux host
        run: |
          python -m pip install unicorn==2.1.4 pefile==2024.8.26
          python recovery/scripts/GenerateAudioResamplerOracle.py --output oracle/original.tsv.gz
      - name: Summarize results and selected upload size
        if: always()
        env:
          ARTIFACT_PATHS: |
            oracle/original.tsv.gz
        run: python recovery/scripts/WriteCiSummary.py --title "Audio resampler oracle transfer"
      # Required original oracle transfer to the Windows validation job in this run.
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: audio-resampler-oracle-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: |
            oracle/original.tsv.gz
          if-no-files-found: error
  validate:
    needs: oracle
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: audio-resampler-oracle-${{ github.run_id }}-${{ github.run_attempt }}
          path: oracle
      - name: Compare original CPU and Debug/Release kernel
        shell: pwsh
        run: ./recovery/scripts/TestAudioResampler.ps1 -OracleInput oracle/original.tsv.gz
      - name: Summarize results and selected upload size
        if: always()
        env:
          ARTIFACT_PATHS: |
            recovery/evidence/audio/resampler-validation/${{ github.run_id }}-${{ github.run_attempt }}/**/*.json
            recovery/evidence/audio/resampler-validation/${{ github.run_id }}-${{ github.run_attempt }}/**/*.jsonl
            recovery/evidence/audio/resampler-validation/${{ github.run_id }}-${{ github.run_attempt }}/**/*.log
            recovery/evidence/audio/resampler-validation/${{ github.run_id }}-${{ github.run_attempt }}/**/*.txt
            recovery/evidence/audio/resampler-validation/${{ github.run_id }}-${{ github.run_attempt }}/**/*.md
            recovery/evidence/audio/resampler-validation/${{ github.run_id }}-${{ github.run_attempt }}/**/*.csv
            recovery/evidence/audio/resampler-validation/${{ github.run_id }}-${{ github.run_attempt }}/**/*.tsv
        run: python recovery/scripts/WriteCiSummary.py --title "Audio resampler validation"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: audio-resampler-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          path: |
            recovery/evidence/audio/resampler-validation/${{ github.run_id }}-${{ github.run_attempt }}/**/*.json
            recovery/evidence/audio/resampler-validation/${{ github.run_id }}-${{ github.run_attempt }}/**/*.jsonl
            recovery/evidence/audio/resampler-validation/${{ github.run_id }}-${{ github.run_attempt }}/**/*.log
            recovery/evidence/audio/resampler-validation/${{ github.run_id }}-${{ github.run_attempt }}/**/*.txt
            recovery/evidence/audio/resampler-validation/${{ github.run_id }}-${{ github.run_attempt }}/**/*.md
            recovery/evidence/audio/resampler-validation/${{ github.run_id }}-${{ github.run_attempt }}/**/*.csv
            recovery/evidence/audio/resampler-validation/${{ github.run_id }}-${{ github.run_attempt }}/**/*.tsv
          if-no-files-found: warn
