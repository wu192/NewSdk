name: Patch FX validation replay
on:
  push:
    branches: [feat/patch-fx-config-version]
    paths:
      - '.github/workflows/patch-fx-replay.yml'
      - 'recovery/scripts/TestCompilerPatchFx.ps1'
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/recovery/evidence/
      - uses: actions/download-artifact@v4
        with:
          name: patch-fx-runtime-42338796649-1
          run-id: 42338796649
          github-token: ${{ github.token }}
          path: work/patch-runtime
      - name: Verify unchanged production source and runtime identity
        shell: pwsh
        run: |
          foreach ($mode in @('Debug','Release')) {
            $receipt = Get-Content "work/patch-runtime/$mode/build.json" -Raw | ConvertFrom-Json
            $changes = @(git diff --name-only $receipt.sourceCommit HEAD -- recovery/src SDK recovery/build 'recovery/scripts/Build*.ps1' .gitattributes)
            if ($changes.Count) { throw "Production inputs changed: $changes" }
            $hash = (Get-FileHash "work/patch-runtime/$mode/bin/NewModCompiler.exe" -Algorithm SHA256).Hash
            if ($hash -ine $receipt.exeSha256) { throw 'EXE differs from producer build receipt' }
          }
      - name: Replay real patch and FX checks with current test script
        shell: pwsh
        run: ./recovery/scripts/TestCompilerPatchFx.ps1 -CompilerDirectory work/patch-runtime -OutputDirectory work/patch-replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patch-fx-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/patch-replay/
          if-no-files-found: warn
          retention-days: 7
